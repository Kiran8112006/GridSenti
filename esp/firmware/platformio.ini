; ============================================================
; GridSenti — ESP8266 Firmware
; PlatformIO Configuration
; ============================================================

[env:nodemcuv2]
platform  = espressif8266
board     = nodemcuv2
framework = arduino

; ── Serial monitor ───────────────────────────────────────────
monitor_speed = 115200

; ── Library dependencies ─────────────────────────────────────
lib_deps =
  bblanchon/ArduinoJson @ ^7.4.1
  ; TODO: Add MQTT library when implementing real telemetry:
  ; knolleary/PubSubClient @ ^2.8

; ── Build flags ──────────────────────────────────────────────
build_flags =
  -D MONITOR_SPEED=115200
  -D NODE_ID=\"GS-NODE-001\"

; ── Upload ───────────────────────────────────────────────────
upload_port = COM3        
; upload_speed = 921600
